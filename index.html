<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Glim</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #clock {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 200 14vmin/1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: .04em;
    color: #c9b48a; font-variant-numeric: tabular-nums; pointer-events: none;
    transition: opacity .6s;
  }
  #clock.small { font-size: 6vmin; align-items: flex-end; padding-bottom: 6vmin; box-sizing: border-box; opacity: .7; }
  #clock.hidden { opacity: 0; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 2.5vmin; text-align: center; color: #6f6551;
    font: 14px -apple-system, sans-serif; transition: opacity 1s; opacity: 0; pointer-events: none;
  }
  #hint.show { opacity: 1; }
  #veil { position: fixed; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"></div>
<div id="veil"></div>
<div id="hint">1–9 mod · C saat · ↑↓ parlaklık · Esc kapat</div>
<script>
const MODES = ['clock', 'breath', 'aurora', 'fireflies', 'rain', 'sphere', 'stars', 'waves', 'embers'];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const veil = document.getElementById('veil');
const hint = document.getElementById('hint');
let settings = { mode: 'clock', showClock: false, dim: 0.85 };
let W = 0, H = 0, t0 = performance.now();
let state = {};

function resize() {
  const r = window.devicePixelRatio || 1;
  W = canvas.width = innerWidth * r;
  H = canvas.height = innerHeight * r;
  state = {};
}
addEventListener('resize', resize);
resize();

// Sıcak, düşük kontrastlı renkler: göz yormasın diye mavi ışık yok.
const scenes = {
  // Dönen nokta küresi: yüzeye dağılmış, öne yaklaştıkça büyüyüp parlaklaşan noktalar.
  sphere(t) {
    if (!state.sp) {
      const N = 1500, pts = [];
      for (let i = 0; i < N; i++) {
        const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
        const k = Math.random() < 0.12 ? Math.cbrt(Math.random()) * 0.85 : 0.9 + Math.random() * 0.1;
        pts.push({ x: Math.cos(th) * r * k, y: y * k, z: Math.sin(th) * r * k, s: 1 + Math.random() * 2.6, h: 24 + Math.random() * 18 });
      }
      state.sp = pts;
    }
    ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
    const dpr = devicePixelRatio || 1, R = Math.min(W, H) * 0.3;
    const a = t * 0.0001, ca = Math.cos(a), sa = Math.sin(a), tilt = 0.4, ct = Math.cos(tilt), st = Math.sin(tilt);
    for (const p of state.sp) {
      const x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;
      const y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct;
      const d = (z2 + 1) / 2, f = 1 + 0.18 * z2;
      ctx.fillStyle = `hsla(${p.h},60%,${48 + 24 * d}%,${0.18 + 0.7 * d})`;
      ctx.beginPath();
      ctx.arc(W / 2 + x1 * R * f, H / 2 + y2 * R * f, p.s * dpr * (0.7 + 1.1 * d), 0, 6.2832);
      ctx.fill();
    }
  },

  stars(t) {
    const dpr = devicePixelRatio || 1;
    if (!state.st) state.st = Array.from({ length: 320 }, () => ({
      x: Math.random() * W, y: Math.random() * H, z: 0.2 + Math.random() * 0.8, ph: Math.random() * 6.28,
    }));
    ctx.fillStyle = '#040302'; ctx.fillRect(0, 0, W, H);
    for (const s of state.st) {
      s.x -= s.z * 0.12 * dpr; if (s.x < 0) s.x += W;
      const tw = 0.5 + 0.5 * (Math.sin(t * 0.0008 * s.z + s.ph) + 1) / 2;
      ctx.fillStyle = `rgba(225,195,150,${tw * s.z})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, (0.8 + s.z * 1.9) * dpr, 0, 6.2832); ctx.fill();
    }
  },

  waves(t) {
    ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = `rgba(${150 - i * 10},${95 - i * 6},${50 - i * 3},0.10)`;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 10) {
        const y = H * (0.45 + 0.08 * i) + Math.sin(x / W * (3 + i) + t / (4500 + i * 1100) + i) * H * (0.035 + 0.01 * i);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    }
  },

  embers(t) {
    const dpr = devicePixelRatio || 1;
    if (!state.em) state.em = Array.from({ length: 70 }, () => ({
      x: Math.random() * W, y: Math.random() * H, v: (0.15 + Math.random() * 0.4) * dpr,
      ph: Math.random() * 6.28, r: (1 + Math.random() * 2.2) * dpr,
    }));
    ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
    for (const e of state.em) {
      e.y -= e.v; e.x += Math.sin(t * 0.0007 + e.ph) * 0.35 * dpr;
      if (e.y < -20) { e.y = H + 20; e.x = Math.random() * W; }
      const a = Math.max(0, e.y / H) * 0.7;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 5);
      g.addColorStop(0, `rgba(230,150,80,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(e.x - e.r * 5, e.y - e.r * 5, e.r * 10, e.r * 10);
    }
  },

  clock() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); },

  breath(t) {
    ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
    const k = (Math.sin(t / 2000 * Math.PI / 2) + 1) / 2; // ~8 sn'lik nefes
    const r = Math.min(W, H) * (0.12 + 0.12 * k);
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r * 2);
    g.addColorStop(0, `rgba(201,150,90,${0.35 + 0.2 * k})`);
    g.addColorStop(0.5, `rgba(150,95,55,${0.15 + 0.1 * k})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  },

  aurora(t) {
    ctx.fillStyle = '#040302'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const cols = ['120,70,40', '150,100,50', '90,60,60'];
    for (let i = 0; i < 3; i++) {
      const x = W * (0.5 + 0.3 * Math.sin(t / 9000 + i * 2.1));
      const y = H * (0.5 + 0.25 * Math.cos(t / 11000 + i * 1.7));
      const r = Math.min(W, H) * 0.55;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${cols[i]},0.30)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'source-over';
  },

  fireflies(t) {
    if (!state.ff) {
      state.ff = Array.from({ length: 40 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
        ph: Math.random() * 6.28, sp: .0004 + Math.random() * .0006,
        r: (2 + Math.random() * 3) * (devicePixelRatio || 1),
      }));
    }
    ctx.fillStyle = 'rgba(5,4,3,0.25)'; ctx.fillRect(0, 0, W, H);
    for (const f of state.ff) {
      f.x = (f.x + f.vx + W) % W; f.y = (f.y + f.vy + H) % H;
      const a = (Math.sin(t * f.sp + f.ph) + 1) / 2;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 6);
      g.addColorStop(0, `rgba(220,180,110,${0.55 * a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(f.x - f.r * 6, f.y - f.r * 6, f.r * 12, f.r * 12);
    }
  },

  rain() {
    const r = devicePixelRatio || 1;
    if (!state.drops) state.drops = Array.from({ length: 90 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      l: (20 + Math.random() * 40) * r, v: (2 + Math.random() * 3) * r,
    }));
    ctx.fillStyle = 'rgba(5,4,3,0.35)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(170,140,100,0.25)'; ctx.lineWidth = r;
    ctx.beginPath();
    for (const d of state.drops) {
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y + d.l);
      d.y += d.v;
      if (d.y > H) { d.y = -d.l; d.x = Math.random() * W; }
    }
    ctx.stroke();
  },
};

function tickClock() {
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const visible = settings.mode === 'clock' || settings.showClock;
  clockEl.classList.toggle('hidden', !visible);
  clockEl.classList.toggle('small', settings.mode !== 'clock');
}
setInterval(tickClock, 1000);

function frame(now) {
  scenes[settings.mode]?.(now - t0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function apply(s) {
  if (s.mode !== settings.mode) state = {};
  settings = s;
  veil.style.opacity = String(1 - settings.dim);
  tickClock();
}

okuma.onSettings(apply);

let hintTimer;
function showHint() {
  hint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove('show'), 3000);
}
showHint();

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return okuma.close();
  const n = Number(e.key);
  if (n >= 1 && n <= MODES.length) okuma.update({ mode: MODES[n - 1] });
  else if (e.key.toLowerCase() === 'c') okuma.update({ showClock: !settings.showClock });
  else if (e.key === 'ArrowUp') okuma.update({ dim: Math.min(1, +(settings.dim + 0.05).toFixed(2)) });
  else if (e.key === 'ArrowDown') okuma.update({ dim: Math.max(0.2, +(settings.dim - 0.05).toFixed(2)) });
  showHint();
});
addEventListener('click', () => okuma.close());
</script>
</body>
</html>
